name: Release

# Tag-triggered: publish SHA-256-verified prebuilt FFI-free `kx` binaries on a `v*`
# tag (the tag is cut from an already-green `main`). This is NOT a pull-request /
# branch check, so it adds NO branch-protection status context. `scripts/install.sh`
# downloads these assets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for"
        required: true

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  # ---------------------------------------------------------------------------
  # build — one FFI-free `kx` per target, on a NATIVE runner (no cross-compile):
  # linux-x86_64 (ubuntu), linux-aarch64 (ubuntu-arm), macos-arm64 (macos-14).
  # Asset names are the target triples, so adding a future target (e.g.
  # x86_64-pc-windows-msvc, x86_64-apple-darwin) is a localized matrix add — the
  # install-script detection already has the seams.
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - name: Checkout (NO submodules — the prebuilt `kx` is FFI-free)
        uses: actions/checkout@v6

      - name: Toolchain (from rust-toolchain.toml)
        run: cargo --version

      # D139: the prebuilt binary ships the EMBEDDED WEB CONSOLE — the `console`
      # feature embeds `ui/dist` at compile time, so the SPA (and the TS SDK it
      # depends on) is built here first. Node is a RELEASE-RUNNER tool only;
      # plain `cargo build/install -p kx-cli` stays node-free (feature off).
      - name: Set up Node (console embed input)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the TS SDK + the web console dist
        run: |
          npm --prefix bindings/typescript ci
          npm --prefix bindings/typescript run build
          npm --prefix ui ci
          npm --prefix ui run build

      # The FFI wall, asserted on the EXACT feature set this job ships: none of
      # `console` / `hnsw` / `serve-engine` / `hosted-apps` may ever drag the llama.cpp
      # FFI into the closure (serve-engine adds the FFI-FREE Ollama backend; the
      # in-process llama.cpp path stays the opt-in `inference` build — PR-A.1;
      # hosted-apps adds only tokio/process + tokio/io-util and zero crates). The
      # required `build-serve-engine` CI job re-proves this on a toolchain-free runner.
      - name: FFI wall (console,hnsw,serve-engine,hosted-apps stays llama.cpp-free)
        shell: bash
        run: |
          if cargo tree -p kx-cli --features console,hnsw,serve-engine,hosted-apps -e normal | grep -qE 'kx-llamacpp'; then
            echo "::error::the console/hnsw/serve-engine/hosted-apps features dragged the FFI into kx-cli"; exit 1
          fi
          # W6.1: the release deliberately excludes the observability stack
          # (audit + monitoring are a Cloud capability) — kx-otel appearing in
          # THIS closure means the exclusion silently regressed.
          if cargo tree -p kx-cli --features console,hnsw,serve-engine,hosted-apps -e normal | grep -qE 'kx-otel'; then
            echo "::error::the release feature set linked kx-otel (observability must stay opt-in)"; exit 1
          fi

      # PR-A.1: the prebuilt now ships `serve-engine` (FFI-free), so a toolchain-free
      # `curl | install.sh` install AUTO-DETECTS a running Ollama daemon and serves
      # local models out of the box. llama.cpp stays the opt-in `--features inference`
      # build (needs a C++ toolchain).
      #
      # D213: `hosted-apps` ships too. Without it the four hosted RPCs answer
      # `unimplemented` on the released binary, so a user can create a hosted App in the
      # console and never start one. It is FFI-free by construction (see the wall above)
      # and adds no BUILD dependency — serving a hosted App needs Node/npm at RUN time.
      - name: Build kx (FFI-free; embedded console + datasets + Ollama serve + hosted Apps)
        run: cargo build --release -p kx-cli --features console,hnsw,serve-engine,hosted-apps

      - name: Package + checksum
        shell: bash
        run: |
          asset="kx-${{ matrix.target }}"
          cp target/release/kx "$asset"
          strip "$asset" || true
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kx-${{ matrix.target }}
          path: |
            kx-${{ matrix.target }}
            kx-${{ matrix.target }}.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # publish — gather the per-target binaries, assemble one `checksums.txt`, and
  # create (or update) the GitHub Release via the gh CLI (no third-party action).
  # ---------------------------------------------------------------------------
  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # CHECKOUT FIRST, BEFORE the artifacts are downloaded. `actions/checkout` defaults
      # to `clean: true`, which runs `git clean -ffdx` and so DELETES untracked paths —
      # including a `dist/` that was populated before it. Ordering it after the download
      # cost v0.2.0-rc.1 its release: all three binaries built, the notes extracted, and
      # the publish step then failed with `no matches found for dist/*`. Nothing could
      # have caught it earlier — `release.yml` runs only on a tag, so a tag IS its first
      # execution. Keep this step first.
      - name: Checkout (for the CHANGELOG)
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble checksums.txt
        shell: bash
        run: |
          cd dist
          cat kx-*.sha256 > checksums.txt
          rm -f kx-*.sha256
          echo "=== release assets ==="; ls -la
          echo "=== checksums.txt ==="; cat checksums.txt

      # The release body is the CHANGELOG's own section for this tag, not a generated
      # list of merged PR titles. `--generate-notes` answers "which branches landed";
      # the CHANGELOG answers "what this release IS", which is what a reader wants and
      # what was written deliberately.
      - name: Extract the release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          bash scripts/release-notes.sh "$tag" CHANGELOG.md > notes.md
          # Fail LOUDLY rather than fall back. A silent fallback to generated notes is how
          # a release ships with the wrong body: the heading drifts, nobody looks, and the
          # curated notes are quietly never used again.
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${tag#v}]' section — add it before tagging," \
                 "or the release body would silently become a list of PR titles."
            exit 1
          fi
          echo "extracted $(wc -l < notes.md) lines of release notes for $tag"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # DELIBERATELY NOT `--prerelease`, even for an `-rc.N` tag.
          #
          # `scripts/install.sh` defaults to `releases/latest/download`, and GitHub computes
          # `latest` from non-prerelease releases ONLY. So marking a release candidate as a
          # prerelease would leave every `curl | sh` install pinned to the last stable
          # release — which is the more misleading outcome by far, and gets worse the longer
          # the RC line runs. The notes say plainly that this is a candidate.
          #
          # If you want honest prerelease labelling, `install.sh` has to learn to resolve a
          # channel first; do both in one change or not at all.
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "${{ github.repository }}" --clobber
            gh release edit "$tag" --repo "${{ github.repository }}" --notes-file notes.md
          else
            gh release create "$tag" dist/* \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --notes-file notes.md
          fi
