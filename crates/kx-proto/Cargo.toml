[package]
name = "kx-proto"
# 0.6.0 — the Apps-closeout wire delta. ADDITIVE on the wire (D120.6; `buf breaking` is
# clean), but additive-in-proto is BREAKING-in-Rust for the generated code, and this bump
# is what `semver-checks` asks for: HostedAppStatus gains a pub field, HostedAppState gains
# a variant, and the KxGateway service trait gains `delete_app` with no default. Same
# reason 0.4.0 → 0.5.0 was taken for the additive GetScaffoldStatus fields.
# 0.8.0 — GetAppManifestResponse gains `datasets` (field 7): wire-additive (proto-breaking
# clean), but the generated struct gains a pub field ⇒ breaking-in-Rust, same minor bump.
# 0.10.0 -> 0.11.0: `DerivedAppStep` gained the per-step capability bindings. Additive on
# the WIRE (new field numbers), but a prost struct's public fields make it a Rust
# struct-literal break — which on a Cargo 0.x crate is a MINOR bump, never a patch.
# 0.13.0 -> 0.14.0: branch history (BranchVersion + ListBranchVersions/RestoreBranch)
# and `AppSummary.lifecycle`. Wire-additive (`buf breaking` clean), but the service
# trait gains two methods and AppSummary gains a pub field ⇒ breaking-in-Rust, minor.
# 0.14.0 -> 0.15.0: the durable Workflow entity (WorkflowSummary + Save/List/Get/Run/
# Delete), three WorkflowStepKind variants (HTTP/WAIT/CONDITIONAL), the trigger
# workflow target + dead-letter governance fields, and RestoreBranchResponse.
# workflow_resynced. Wire-additive (`buf breaking` clean), but the service trait
# gains five methods, three messages gain pub fields, and a prost enum gains
# variants ⇒ breaking-in-Rust, minor.
# 0.15.0 -> 0.16.0: the NL authoring surface (ProposeControlAction +
# DescribeControlSurface) and the durable Policy/Role registry (Put/List/Delete/
# Assign). Wire-additive (`buf breaking` clean), but the service trait gains SIX
# methods ⇒ breaking-in-Rust, minor. Note the two reduced preview arms:
# `ProposedSecretName` and `ProposedScript` exist so that no field named
# value/argv/env is reachable from `ControlPreview` — a property the descriptor
# walk in `src/lib.rs` asserts against this crate's own FileDescriptorSet.
# 0.16.0 -> 0.17.0: `ReactTurnSummary.raw` — the model output a REFUSED turn was
# settled FROM, so a refusal decided by a heuristic over those bytes can be checked
# against its own input instead of taken on trust. Wire-additive (`buf breaking`
# clean, a new field on an existing message), but the message is an exhaustive
# struct literal in Rust so every construction site gains a field ⇒
# breaking-in-Rust, minor. Populated iff branch == "rejected" and server-capped;
# it is a PROJECTION read of an already-committed turn output — no journal fact
# carries it and no digest moves.
# 0.17.0 -> 0.18.0: `ReportFailureRequest.detail` — the MODEL-FACING diagnostic the
# failing subsystem itself produced, carried across the worker -> coordinator report so
# the journal-v18 `Failed.detail` is populated on the DISTRIBUTED path too (the
# in-executor commit protocol already populated it; `kx serve` takes the worker path,
# so every served run lost its diagnosis here). Wire-additive and trailing — an older
# worker sends no field, which decodes to "" and is byte-identical to the previous
# behaviour — but an exhaustive struct literal in Rust, so every construction site
# gains a field => breaking-in-Rust, minor. No journal SHAPE moves (v18 already has the
# field) and the product identity digest is invariant: a `Failed` entry is not an
# identity input.
# 0.19.0 -> 0.20.0: the CONNECTOR ENVIRONMENT MAP — a new `McpEnvEntry` message, plus
# `RegisterMcpServerRequest.env` and `McpServer.env_names`. A stdio server could previously
# receive exactly one environment variable and its NAME was forced to be the credential
# ref's name, so a server needing two was unconfigurable. Both halves of an entry are NAMES
# (the variable, and the ref that supplies it) — no secret value crosses the wire, and
# `env_names` publishes the variables only, never the refs behind them. A prost struct
# gaining a field is breaking-in-Rust => minor. No journal shape and no digest input moves:
# connections live in an off-journal, rebuildable sidecar.
# 0.18.0 -> 0.19.0: the `OffloadModel` IN-USE GUARD — `OffloadModelRequest.force`, plus
# `OffloadModelResponse.{in_use_by, refused, usage_checked}` and the new `ModelHolder`
# message / `ModelHolderKind` enum. Offloading destroys a model, so live work bound to it
# is disrupted irreversibly; the RPC previously evicted unconditionally, with no way to
# warn and nothing recorded about what was disrupted. `usage_checked` exists because an
# empty holder list from a gateway with no usage view is otherwise indistinguishable from
# a clean check — an unwired guard must not read as a clean bill of health.
# Wire-additive and trailing (an older client sends no `force`, decoding to `false`, which
# is the SAFE arm), but exhaustive struct literals in Rust give every construction site a
# field => breaking-in-Rust, minor. Off-journal, off-digest: RAM residency is ephemeral
# state that rebuilds empty on restart and has never been an identity input.
version = "0.21.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "kortecx P2.1 gRPC schema (tonic/prost) — the coordinator/worker distribution boundary and cross-language (Rust/Python/TypeScript) contract: submit Mote, report commit, heartbeat, register worker."
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tonic = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
# Domain crates — kx-proto owns the single tested proto<->domain mapping +
# the identity round-trip (MoteId / warrant_ref reconstructed Rust-side). It
# does NOT depend on kx-journal: a commit proposal is decoded to kx-mote /
# kx-content typed fields and assembled into a journal entry coordinator-side
# (P2.2), where the seq is assigned.
kx-mote = { workspace = true }
kx-content = { workspace = true }
kx-warrant = { workspace = true }
kx-critic-types = { workspace = true }
bincode = { workspace = true }
smallvec = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = { workspace = true }
# The build script decodes the FileDescriptorSet tonic-build emits and generates
# `control_index.rs` (the machine-known half of the ControlSurface) from it. Both
# are already in the dependency graph via tonic-build; naming them here keeps the
# build script's own imports honest rather than relying on a transitive path.
prost = { workspace = true }
prost-types = { workspace = true }

[dev-dependencies]
# `time` is additive over the workspace tokio features — the skeleton test uses
# a short connect-retry sleep while the in-process server binds.
tokio = { workspace = true, features = ["time"] }
proptest = { workspace = true }
# The descriptor-walk test decodes the SAME FileDescriptorSet the build script
# emitted, to prove no credential-shaped field is reachable from ControlPreview.
# A DEV dependency on purpose: the descriptor bytes must not reach a shipped
# rlib (build.rs "no host paths / never shipped" argument), and a `#[cfg(test)]`
# `include_bytes!` keeps that true.
prost-types = { workspace = true }

[lints]
workspace = true
