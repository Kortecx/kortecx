name: real-model gate (Gemma-4)

# READY-TO-ENABLE, INTENTIONALLY MANUAL (risk-burndown Batch C). The always-on CI real-model gate uses
# Qwen3-0.6B — deterministic but documented as a FALSE GREEN (too weak to reliably emit a tool call), so
# it proves plumbing, not capability. This workflow runs the SAME eval on **Gemma-4-12B** (the local
# parity model), which is strong enough to exercise real agentic behavior — the honest capability
# gate. It is `workflow_dispatch` only (never auto-runs on a PR) because Gemma-4-12B needs a capable
# self-hosted runner (large RAM / GPU) + Actions minutes that the default `ubuntu-latest` runner does not
# have. FLIP TO A REAL GATE: add a `pull_request` / `schedule` trigger once a capable runner is wired, and
# list `real-model-gemma` in the branch-protection required checks.
#
# ⚠ ZERO self-hosted GPU runners are registered today, so this workflow is DORMANT: dispatching it
# fails fast on the runner label. It is wired anyway so that the day a runner is registered, what runs
# is the oracle benchmark (`just eval-bench`) rather than the older trajectory-only step — the wiring
# is the cheap half, the runner is the deferred infrastructure half. Do not read a green (or absent)
# result here as evidence of anything.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Local model tag (Gemma-4 family; NEVER Qwen3 here — that is the false-green)"
        default: "gemma4-12b"
        required: false

permissions:
  contents: read

jobs:
  real-model-gemma:
    name: real-model gate (Gemma-4-12B — the honest capability tier)
    # A CAPABLE self-hosted runner is REQUIRED (a 12B model does not fit the default runner). Wire one,
    # then this runs; until then dispatching it is a no-op / fails fast on the runner label.
    runs-on: [self-hosted, gpu]
    steps:
      - name: Checkout (with submodules — the FFI backend is needed for a real model)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: cargo --version

      - name: Deterministic eval gate first (must be green regardless of the model)
        run: just eval

      - name: Real-model ORACLE benchmark on Gemma-4 (env-labelled; ratcheted per engine)
        env:
          KX_MODEL_NAME: ${{ github.event.inputs.model }}
          KX_EVAL_ENV_LABEL: gh-self-hosted-gpu
        run: |
          set -euo pipefail
          # Serve Gemma-4 and score every bench-v1 run with the ORACLE scorers, across all
          # four substrate families (tool/react · reach · swarm). This replaced the older
          # trajectory-only `just eval-real` step: that one read turns/tools/terminal and
          # never the committed answer, so it could not fail when answer QUALITY degraded.
          # `eval-bench` compares against the committed per-engine baseline and fails closed.
          just eval-bench
          echo "✅ real-model (Gemma-4) oracle benchmark ran — numbers ratcheted against the committed baseline."
